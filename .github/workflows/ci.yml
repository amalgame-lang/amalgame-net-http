name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test against amc ${{ matrix.amc-tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        amc-tag: [v0.8.39]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgc-dev libssl-dev libcurl4-openssl-dev libnghttp2-dev

      # v0.9.1: Http1.ServeAsync requires amalgame-async's runtime
      # header (epoll-driven fiber I/O). The version pin matches
      # the [dependencies] entry in amalgame.toml.
      - name: Checkout amalgame-async (peer dep)
        uses: actions/checkout@v4
        with:
          repository: amalgame-lang/amalgame-async
          ref: v0.2.2
          path: amalgame-async-sibling
      - name: Stage amalgame-async at sibling path
        run: |
          mkdir -p ../amalgame-async
          cp -r amalgame-async-sibling/* ../amalgame-async/
          ls ../amalgame-async/runtime/

      - name: Download amc ${{ matrix.amc-tag }}
        run: |
          set -e
          TAG="${{ matrix.amc-tag }}"
          VERSION="${TAG#v}"
          curl -sSL -o amc.tar.gz \
            "https://github.com/amalgame-lang/Amalgame/releases/download/${TAG}/amc-${VERSION}-linux-x86_64.tar.gz"
          mkdir -p $RUNNER_TEMP/amc-install
          tar -xzf amc.tar.gz -C $RUNNER_TEMP/amc-install --strip-components=1
          echo "AMC=$RUNNER_TEMP/amc-install/bin/amc" >> $GITHUB_ENV
          echo "AMC_RUNTIME=$RUNNER_TEMP/amc-install/share/amalgame/runtime" >> $GITHUB_ENV

      - name: Run tests
        run: ./tests/run_tests.sh "$AMC"
