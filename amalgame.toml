# amalgame-net-http — HTTP/1.1 + HTTP/2 client + server primitives.
#
# v0.1: pure-Amalgame HTTP/1.1 parser + render. User had to bring
#       their own accept loop.
# v0.2: nghttp2 binding for h2c (HTTP/2 cleartext) server +
#       Http2.Serve(port, handler) high-level entry point.
# v0.2.1: HTTP/1.1 high-level server (Http1.Serve(port, handler)) —
#       browser-friendly, mirror-API to Http2.Serve. Same closure
#       shape, just speaks HTTP/1.1 on the wire (one request per
#       connection, Connection: close). Use this when you want to
#       open the demo in Chrome / Firefox.
#
# TLS + ALPN h2 negotiation is planned for v0.2.x — that's what
# unblocks h2 over HTTPS in real browsers.
#
# Install:
#   amc package add net-http
#
# Depends on:
#   - amalgame-tls (planned for HTTPS — already a dep of amalgame-web)
#   - libnghttp2   (system library, for the v0.2 H2 binding)
#
# See proposal: docs/proposals/amalgame-web.md (§4.2)

[package]
name              = "amalgame-net-http"
version           = "0.24.0"
license           = "Apache-2.0"
description       = "HTTP/1.1 + HTTP/2 (h2c + HTTPS+ALPN h2) + WebSocket (ws/wss). v0.24.0: H2 client over TLS — H2Client.ConnectTls(host,port,insecure) does an OpenSSL handshake with ALPN h2 + SNI + (optional) hostname/cert verification, then H2Client.Unary runs over the TLS connection; unblocks a gRPC client over TLS. Verified by a ConnectTls ↔ HttpsServer smoke. v0.23.0: synchronous HTTP/2 (h2c) CLIENT — H2Client.ConnectH2c(host,port) + H2Client.Unary(path, body:List<int>, contentType) drives one request/response, with binary-safe body access (BodyByteAt) and grpc-status/grpc-message TRAILER capture; enough to drive a gRPC client (amalgame-net-grpc). Verified by a client↔server smoke (status + trailer + NUL/0xFF body byte-exact). v0.22.0: HTTP/2 gRPC primitives — H2Conn.RespondGrpc(body, grpcStatus, grpcMessage) submits :status 200 + content-type application/grpc, a binary-safe body (from a List<int>), and the mandatory grpc-status/grpc-message HTTP/2 TRAILERS (via nghttp2_submit_trailer); H2Conn.BodyByteAt(i) gives binary-safe request-body access (H2Conn.Body's string view truncates protobuf at NUL). Verified on the wire by a real nghttp2 client (trailers + NUL/0xFF body byte-exact). This unblocks a gRPC server (amalgame-net-grpc). v0.21.0: IPv6 dual-stack listeners — the HTTP/1.1 and HTTPS-H1 servers (incl. the async ServeAsync path) now bind an AF_INET6 socket with IPV6_V6ONLY=0, accepting BOTH IPv6 and IPv4 clients on one listener, with an automatic AF_INET fallback when IPv6 is unavailable (no behaviour regression). IPv4 clients arrive v4-mapped and RemoteAddr normalizes them back to plain a.b.c.d, so rate-limit keys / Host-guard / access-log semantics are unchanged. v0.20.0: connection-level cap — Http1.SetMaxConnections(n) bounds concurrently-served connections across every multi-thread accept loop (HTTP/1.1, HTTPS-H1, HTTP/2), rejecting (closing) new connections past the ceiling to defend against connection exhaustion / slowloris-at-connection-level and bound worker-thread RSS; Http1.ActiveConnections() reads the live count. 0 = unlimited (default). v0.19.0: opt-in security helpers — UploadedFile.SafeFilename()/Extension()/SaveToDir(dir,maxBytes) sanitize attacker-controlled upload filenames (path-traversal-safe) and cap size; HttpResponse.RedirectLocal(path) only redirects to same-origin paths (rejects //host, scheme, CRLF) to stop open redirects; HttpClient.GetGuarded(url)/HostIsPublic(host) refuse loopback/RFC1918/link-local/CGNAT/ULA + IPv4-mapped + the 169.254.169.254 metadata endpoint (SSRF). Existing Redirect/Get/SaveTo are unchanged. v0.18.0: security hardening — the H1 request parser now rejects request-smuggling vectors (Content-Length + Transfer-Encoding together, any Transfer-Encoding on a request since chunked request bodies are unsupported, conflicting duplicate Content-Length, non-numeric Content-Length) and empty method/target request lines; WebSocket gains an Origin allow-list — Ws.ServeWithOrigins(port, csv, handler) rejects (403) handshakes whose Origin isn't listed, defending against Cross-Site WebSocket Hijacking. v0.17.0: WebSocket subprotocol negotiation — Ws.ServeWithProtocols(port, csv, handler) echoes the first client-offered Sec-WebSocket-Protocol the server supports; WsConn.Subprotocol reads it back. v0.16.0: SseConn — Server-Sent Events over the v0.14.0 streaming primitives (Open / Send / SendEvent / Comment / Retry / Close), for live push without WebSocket. v0.15.0: HTTP Range support — H1Conn.RespondFileRange (206 Partial Content, caller Content-Range header) + HttpResponse.FileRange; backs the Static middleware's Range / 206 + Last-Modified. v0.14.1: multipart/form-data parser (Multipart / UploadedFile, pure-AM over raw bytes — binary-safe file uploads) + H1Conn.RespondBytesFull (binary body with caller headers, for gzip/binary responses) + HttpRequest.BodyPtr/BodyLen. v0.14.0: response streaming primitives (H1Conn.BeginStream / WriteRaw / WriteRawBytes / Flush) for SSE + long-poll, and H1Conn.BodyByteAt for binary-safe multipart parsing. v0.13.0: HTTPS keep-alive — HttpsH1Server.ServeConn/ServeConnOn loop parse→handler→ResetForReuse on one TLS connection (one handshake per page, not per asset), for custom SNI/multi-site accept loops. v0.12.2: req.Path percent-decode. v0.12.1: SNI full chain + AcceptParsed."
required-amalgame = ">=0.8.58"
schema-version    = 1

[stdlib]
# Multi-class manifest. The package ships a pure-AM facade for
# request/response types + a thin nghttp2 binding (H2*) and a
# pure-C HTTP/1.1 server (H1*) for browser compatibility.
classes   = [
    "HttpRequest",
    "HttpResponse",
    "HttpServer",
    "HttpClient",
    "Cookie",
    "HttpRequestBuilder",
    "H1Server",
    "H1Conn",
    "Http1",
    "H2Server",
    "H2Conn",
    "H2Client",
    "H2",
    "Http2",
    "HttpsServer",
    "Https",
    "HttpsH1Server",
    "WsServer",
    "WsConn",
    "Ws",
    "WssServer",
    "Wss",
    "HttpServerConfig",
    "Multipart",
    "UploadedFile",
    "SseConn",
]
header    = "runtime/Amalgame_Net_Http.h"
namespace = "Amalgame.Net.Http"
facade    = "facade.am"
# Multi-file split (v0.4.6). facade.am holds the namespace anchor +
# package-level docs; each public class lives in its own source.
# Order matters for cross-file references: cookie before
# http_response (which calls SetCookie); http_request + http_response
# before http_parser (which produces them); both before http_server
# (which uses them); http_client builds on HttpRequest/HttpResponse.
sources   = [
    "cookie.am",
    "http_request.am",
    "http_response.am",
    "http_parser.am",
    "http_server.am",
    "http_client.am",
    "multipart.am",
    "sse.am",
]

libs = ["nghttp2", "ssl", "crypto"]

[stdlib.functions]
# ── H1Server — HTTP/1.1 listening socket (v0.2.1) ────────────────
H1Server_Listen              = { returns = "AmalgameH1Server*" }
H1Server_IsListening         = { returns = "code_bool" }
H1Server_Accept              = { returns = "AmalgameH1Conn*" }
H1Server_Close               = { returns = "void" }
# v0.9.0 — raw fd accessor for async-aware user code
# (pair with amalgame-async ≥ v0.2.0: WaitFdReadable + accept4).
H1Server_RawFd               = { returns = "i64" }
# ── H1Conn — HTTP/1.1 server connection (v0.2.1) ─────────────────
H1Conn_Method                = { returns = "code_string" }
H1Conn_Path                  = { returns = "code_string" }
H1Conn_RawTarget             = { returns = "code_string" }
H1Conn_RemoteAddr            = { returns = "code_string" }
H1Conn_Header                = { returns = "code_string" }
H1Conn_Body                  = { returns = "code_string" }
H1Conn_BodyLen               = { returns = "i64" }
# v0.14.0 — raw body byte at index i (0..BodyLen-1) as i64 0..255, -1
# out of range. H1Conn_Body truncates at the first NUL (code_string);
# this walks the binary buffer byte-by-byte for the multipart parser.
H1Conn_BodyByteAt            = { returns = "i64" }
H1Conn_Respond               = { returns = "void" }
# v0.11.1 — caller-supplied header block (Location, Set-Cookie,
# CSP, …). headers_block is "Name: Value\r\n"-formatted; the C
# runtime adds the status-line, Content-Length, and Connection
# headers, then appends this block, the end-of-headers blank
# line, and the body. Used by HttpResponse.WriteToH1Conn so
# arbitrary headers set via .Header(…) finally reach the wire.
H1Conn_RespondFull           = { returns = "void" }
# v0.9.6 — binary-safe response variants. Both carry Content-Length
# explicitly instead of strlen(body), so PNG / JPEG / PDF / WASM
# survive NUL bytes intact. RespondFile fopens path in "rb" mode +
# GC_MALLOC + send; returns 0 on success, -1 on open/read failure.
H1Conn_RespondBytes          = { returns = "void" }
# v0.14.1 — binary body (ptr,len) WITH a caller header block. The
# binary-safe sibling of RespondFull: gzip / image responses keep
# their Content-Encoding / CSP / Set-Cookie headers. HttpResponse's
# BodyBytes mode routes here.
H1Conn_RespondBytesFull      = { returns = "void" }
H1Conn_RespondFile           = { returns = "i64" }
# v0.15.0 — serve a byte range [off, off+len) of a file with a caller
# header block (Content-Range / Accept-Ranges / ETag). 206 normally.
# Returns 0 ok, -1 file error, -2 range unsatisfiable (→ 416).
H1Conn_RespondFileRange      = { returns = "i64" }
H1Conn_Close                 = { returns = "void" }
# v0.9.0 — raw connection fd for async I/O parking.
# Pair with amalgame-async ≥ v0.2.0: MakeNonBlocking +
# WaitFdReadable / WaitFdWritable around non-blocking recv / send.
H1Conn_RawFd                 = { returns = "i64" }
# v0.14.0 — response streaming primitives (SSE / long-poll). BeginStream
# emits status + caller headers with NO Content-Length (Connection: close
# framing), forces keep_alive=0 so the keep-alive loop closes after the
# handler returns. WriteRaw/WriteRawBytes push frames (0 ok, -1 peer gone).
# Flush is a no-op on the blocking path (API symmetry / future async hook).
H1Conn_BeginStream           = { returns = "i64" }
H1Conn_WriteRaw              = { returns = "i64" }
H1Conn_WriteRawBytes         = { returns = "i64" }
H1Conn_Flush                 = { returns = "i64" }
# v0.5.0: keep-alive helpers. ResetForReuse clears per-request state
# (keeps fd / config / keep_alive intact) so the parser can reuse the
# struct for the next request on the same connection.
H1Conn_ResetForReuse         = { returns = "void" }
# ── Http1.Serve(port, handler) — high-level HTTP/1.1 entry ───────
Http1_Serve                  = { returns = "i64" }
# Http1.ServeWith(port, config, handler) — same + HttpServerConfig.
# Companion variants added in v0.4.4 for Http2/Https/Ws/Wss. Size-
# limit wiring through the H1 parser still pending v0.4.5.
Http1_ServeWith              = { returns = "i64" }
# Http1.ServeMt(port, handler) — multi-threaded variant (v0.6.0).
# Thread-per-accept; the accept loop never blocks on a slow handler.
# Handler must be thread-safe (use amalgame-threading's Mutex around
# any mutable shared state).
Http1_ServeMt                = { returns = "i64" }
# Http1.ServeAsync(port, handler) — fiber-driven variant (v0.9.1).
# Runs every connection in an amalgame-async fiber; recv / send park
# the fiber on EAGAIN via WaitFdReadable / WaitFdWritable. One OS
# thread, thousands of concurrent slow connections. Linux only (epoll
# backend in amalgame-async v0.2; kqueue/IOCP planned).
Http1_ServeAsync             = { returns = "i64" }
# Http1.ServeAsyncWith(port, cfg, handler) — fiber-driven variant +
# per-conn HttpServerConfig (v0.9.3). Wires listen_backlog,
# max_*_bytes, idle_timeout_sec, and (v0.9.4) header_timeout_sec /
# body_timeout_sec on the async recv path. Slow-client mitigation
# now matches sync ServeWith.
Http1_ServeAsyncWith         = { returns = "i64" }
# Http1.ServeMtWith(port, config, handler) — multi-thread + keep-alive
# + per-conn config (v0.6.1). Production-grade entry point: combines
# ServeMt's accept fan-out with ServeWith's per-connection request
# loop + HttpServerConfig (timeouts + size limits + idle_timeout).
Http1_ServeMtWith            = { returns = "i64" }
# v0.7.0: multi-thread variants for the other 3 servers.
Http2_ServeMt                = { returns = "i64" }
Https_ServeMt                = { returns = "i64" }
Ws_ServeMt                   = { returns = "i64" }
Wss_ServeMt                  = { returns = "i64" }
Http2_ServeWith              = { returns = "i64" }
Https_ServeWith              = { returns = "i64" }
Ws_ServeWith                 = { returns = "i64" }
Wss_ServeWith                = { returns = "i64" }

# ── HttpServerConfig — per-server tunables (v0.4.3) ───────────────
HttpServerConfig_Default                = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithHeaderTimeoutSec   = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithBodyTimeoutSec     = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithIdleTimeoutSec     = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithMaxBodyBytes       = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithMaxHeaderBytes     = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithMaxUrlBytes        = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithListenBacklog      = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithTlsMinVersion      = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithTlsAlpn            = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_HeaderTimeoutSec       = { returns = "i64" }
HttpServerConfig_BodyTimeoutSec         = { returns = "i64" }
HttpServerConfig_IdleTimeoutSec         = { returns = "i64" }
HttpServerConfig_MaxBodyBytes           = { returns = "i64" }
HttpServerConfig_MaxHeaderBytes         = { returns = "i64" }
HttpServerConfig_MaxUrlBytes            = { returns = "i64" }
HttpServerConfig_ListenBacklog          = { returns = "i64" }
HttpServerConfig_TlsMinVersion          = { returns = "i64" }
HttpServerConfig_TlsAlpn                = { returns = "code_string" }
HttpServerConfig_ApplyToFd              = { returns = "void" }
HttpServerConfig_ClearTimeoutsOnFd      = { returns = "void" }

# ── Graceful shutdown (v0.8.0) ──────────────────────────────────
# Idempotent SIGTERM/SIGINT handler + a process-wide stopping flag
# that every Serve* loop polls. Apps don't need to call these
# explicitly — Serve* installs the handlers automatically — but
# `Http1.IsStopping` + `Http1.RequestShutdown` are exposed for
# tests + custom supervisors.
Http1_InstallShutdownSignals = { returns = "void" }
Http1_IsStopping             = { returns = "code_bool" }
Http1_RequestShutdown        = { returns = "void" }
Http1_SetMaxConnections      = { returns = "void" }
Http1_ActiveConnections      = { returns = "i64" }

# ── H2Server — h2c listening socket (v0.2) ───────────────────────
H2Server_Listen              = { returns = "AmalgameH2Server*" }
H2Server_IsListening         = { returns = "code_bool" }
H2Server_Accept              = { returns = "AmalgameH2Conn*" }
H2Server_Close               = { returns = "void" }
# ── H2Conn — h2c server connection (v0.2) ─────────────────────────
H2Conn_NewFromFd             = { returns = "AmalgameH2Conn*" }
H2Conn_NextRequest           = { returns = "i64" }
H2Conn_Method                = { returns = "code_string" }
H2Conn_Path                  = { returns = "code_string" }
H2Conn_Authority             = { returns = "code_string" }
H2Conn_Header                = { returns = "code_string" }
H2Conn_Body                  = { returns = "code_string" }
H2Conn_BodyLen               = { returns = "i64" }
H2Conn_BodyByteAt            = { returns = "i64" }
H2Conn_Respond               = { returns = "void" }
H2Conn_RespondGrpc           = { returns = "void" }
# ── H2Client — synchronous h2c client (v0.23.0) ──────────────────
H2Client_ConnectH2c          = { returns = "AmalgameH2Client*" }
H2Client_ConnectTls          = { returns = "AmalgameH2Client*" }
H2Client_IsConnected         = { returns = "code_bool" }
H2Client_Unary               = { returns = "i64" }
H2Client_Status              = { returns = "i64" }
H2Client_BodyLen             = { returns = "i64" }
H2Client_BodyByteAt          = { returns = "i64" }
H2Client_GrpcStatus          = { returns = "i64" }
H2Client_GrpcMessage         = { returns = "code_string" }
H2Client_ContentType         = { returns = "code_string" }
H2Client_Close               = { returns = "void" }
H2Conn_Close                 = { returns = "void" }
H2_Available                 = { returns = "i64" }
# ── Http2.Serve(port, handler) — high-level h2c server entry ─────
Http2_Serve                  = { returns = "i64" }

# ── HttpsServer + Https.Serve — HTTPS + ALPN h2 (v0.3) ───────────
HttpsServer_Listen           = { returns = "AmalgameHttpsServer*" }
HttpsServer_IsListening      = { returns = "code_bool" }
HttpsServer_Accept           = { returns = "AmalgameH2Conn*" }
HttpsServer_Close            = { returns = "void" }
Https_Serve                  = { returns = "i64" }
Https_ServeMt                = { returns = "i64" }
Https_ServeWith              = { returns = "i64" }

# ── HttpsH1Server — HTTPS-over-HTTP/1.1 (v0.10) ─────────────────
# Same shape as HttpsServer + Https.Serve but advertises ALPN
# "http/1.1" (not "h2") and returns AmalgameH1Conn* on Accept.
# Lets WebApp / Mosaic / Pollen Manager terminate TLS natively
# without an nginx/Caddy proxy in front.
HttpsH1Server_Listen         = { returns = "AmalgameHttpsH1Server*" }
HttpsH1Server_AddSni         = { returns = "code_bool" }
HttpsH1Server_IsListening    = { returns = "code_bool" }
HttpsH1Server_Accept         = { returns = "AmalgameH1Conn*" }
HttpsH1Server_AcceptParsed   = { returns = "AmalgameH1Conn*" }
HttpsH1Server_ServeConn      = { returns = "i64" }
HttpsH1Server_ServeConnOn    = { returns = "i64" }
HttpsH1Server_Close          = { returns = "void" }
HttpsH1Server_RawFd          = { returns = "i64" }
Https_H1Serve                = { returns = "i64" }
Https_H1ServeMt              = { returns = "i64" }

# ── WsServer / WsConn / Ws.Serve — WebSocket server (v0.4) ───────
WsServer_Listen              = { returns = "AmalgameWsServer*" }
WsServer_IsListening         = { returns = "code_bool" }
WsServer_Accept              = { returns = "AmalgameWsConn*" }
WsServer_Close               = { returns = "void" }
WsConn_ReceiveText           = { returns = "code_string" }
WsConn_SendText              = { returns = "code_bool" }
WsConn_IsClosed              = { returns = "code_bool" }
WsConn_Close                 = { returns = "void" }
# v0.17.0 — negotiated Sec-WebSocket-Protocol ("" if none) + a Serve
# variant that advertises a CSV of server-supported subprotocols.
WsConn_Subprotocol           = { returns = "code_string" }
Ws_ServeWithProtocols        = { returns = "i64" }
Ws_ServeWithOrigins          = { returns = "i64" }
Ws_Serve                     = { returns = "i64" }

# ── WssServer / Wss.Serve — wss:// (WebSocket over TLS, v0.4.1) ──
WssServer_Listen             = { returns = "AmalgameWssServer*" }
WssServer_IsListening        = { returns = "code_bool" }
WssServer_Accept             = { returns = "AmalgameWsConn*" }
WssServer_Close              = { returns = "void" }
Wss_Serve                    = { returns = "i64" }

# ─── Dependencies ────────────────────────────────────────────────
# v0.9.1: Http1.ServeAsync uses amalgame-async for fiber I/O parking
# (epoll on Linux; kqueue/IOCP backends planned). Users who only
# touch the synchronous Http1.Serve / ServeMt path still pull async
# in transitively — the static-inline bodies in Amalgame_Async.h
# don't add link-time overhead for symbols they don't reference.
[dependencies]
amalgame-async = ">=0.2.2"
# v0.11.0: HttpClient.Execute for https:// URLs wraps the TCP fd in
# a TLS client stream via amalgame-tls (TlsContext + TlsStream).
amalgame-tls   = ">=0.3.0"
