# amalgame-net-http — HTTP/1.1 + HTTP/2 client + server primitives.
#
# v0.1: pure-Amalgame HTTP/1.1 parser + render. User had to bring
#       their own accept loop.
# v0.2: nghttp2 binding for h2c (HTTP/2 cleartext) server +
#       Http2.Serve(port, handler) high-level entry point.
# v0.2.1: HTTP/1.1 high-level server (Http1.Serve(port, handler)) —
#       browser-friendly, mirror-API to Http2.Serve. Same closure
#       shape, just speaks HTTP/1.1 on the wire (one request per
#       connection, Connection: close). Use this when you want to
#       open the demo in Chrome / Firefox.
#
# TLS + ALPN h2 negotiation is planned for v0.2.x — that's what
# unblocks h2 over HTTPS in real browsers.
#
# Install:
#   amc package add net-http
#
# Depends on:
#   - amalgame-tls (planned for HTTPS — already a dep of amalgame-web)
#   - libnghttp2   (system library, for the v0.2 H2 binding)
#
# See proposal: docs/proposals/amalgame-web.md (§4.2)

[package]
name              = "amalgame-net-http"
version           = "0.9.4"
license           = "Apache-2.0"
description       = "HTTP/1.1 + HTTP/2 (h2c + HTTPS+ALPN h2) + WebSocket server (ws:// + wss://). Fiber-driven Http1.ServeAsync via amalgame-async."
required-amalgame = ">=0.8.39"
schema-version    = 1

[stdlib]
# Multi-class manifest. The package ships a pure-AM facade for
# request/response types + a thin nghttp2 binding (H2*) and a
# pure-C HTTP/1.1 server (H1*) for browser compatibility.
classes   = [
    "HttpRequest",
    "HttpResponse",
    "HttpServer",
    "HttpClient",
    "Cookie",
    "HttpRequestBuilder",
    "H1Server",
    "H1Conn",
    "Http1",
    "H2Server",
    "H2Conn",
    "H2",
    "Http2",
    "HttpsServer",
    "Https",
    "WsServer",
    "WsConn",
    "Ws",
    "WssServer",
    "Wss",
    "HttpServerConfig",
]
header    = "runtime/Amalgame_Net_Http.h"
namespace = "Amalgame.Net.Http"
facade    = "facade.am"
# Multi-file split (v0.4.6). facade.am holds the namespace anchor +
# package-level docs; each public class lives in its own source.
# Order matters for cross-file references: cookie before
# http_response (which calls SetCookie); http_request + http_response
# before http_parser (which produces them); both before http_server
# (which uses them); http_client builds on HttpRequest/HttpResponse.
sources   = [
    "cookie.am",
    "http_request.am",
    "http_response.am",
    "http_parser.am",
    "http_server.am",
    "http_client.am",
]

libs = ["nghttp2", "ssl", "crypto"]

[stdlib.functions]
# ── H1Server — HTTP/1.1 listening socket (v0.2.1) ────────────────
H1Server_Listen              = { returns = "AmalgameH1Server*" }
H1Server_IsListening         = { returns = "code_bool" }
H1Server_Accept              = { returns = "AmalgameH1Conn*" }
H1Server_Close               = { returns = "void" }
# v0.9.0 — raw fd accessor for async-aware user code
# (pair with amalgame-async ≥ v0.2.0: WaitFdReadable + accept4).
H1Server_RawFd               = { returns = "i64" }
# ── H1Conn — HTTP/1.1 server connection (v0.2.1) ─────────────────
H1Conn_Method                = { returns = "code_string" }
H1Conn_Path                  = { returns = "code_string" }
H1Conn_RawTarget             = { returns = "code_string" }
H1Conn_Header                = { returns = "code_string" }
H1Conn_Body                  = { returns = "code_string" }
H1Conn_BodyLen               = { returns = "i64" }
H1Conn_Respond               = { returns = "void" }
H1Conn_Close                 = { returns = "void" }
# v0.9.0 — raw connection fd for async I/O parking.
# Pair with amalgame-async ≥ v0.2.0: MakeNonBlocking +
# WaitFdReadable / WaitFdWritable around non-blocking recv / send.
H1Conn_RawFd                 = { returns = "i64" }
# v0.5.0: keep-alive helpers. ResetForReuse clears per-request state
# (keeps fd / config / keep_alive intact) so the parser can reuse the
# struct for the next request on the same connection.
H1Conn_ResetForReuse         = { returns = "void" }
# ── Http1.Serve(port, handler) — high-level HTTP/1.1 entry ───────
Http1_Serve                  = { returns = "i64" }
# Http1.ServeWith(port, config, handler) — same + HttpServerConfig.
# Companion variants added in v0.4.4 for Http2/Https/Ws/Wss. Size-
# limit wiring through the H1 parser still pending v0.4.5.
Http1_ServeWith              = { returns = "i64" }
# Http1.ServeMt(port, handler) — multi-threaded variant (v0.6.0).
# Thread-per-accept; the accept loop never blocks on a slow handler.
# Handler must be thread-safe (use amalgame-threading's Mutex around
# any mutable shared state).
Http1_ServeMt                = { returns = "i64" }
# Http1.ServeAsync(port, handler) — fiber-driven variant (v0.9.1).
# Runs every connection in an amalgame-async fiber; recv / send park
# the fiber on EAGAIN via WaitFdReadable / WaitFdWritable. One OS
# thread, thousands of concurrent slow connections. Linux only (epoll
# backend in amalgame-async v0.2; kqueue/IOCP planned).
Http1_ServeAsync             = { returns = "i64" }
# Http1.ServeAsyncWith(port, cfg, handler) — fiber-driven variant +
# per-conn HttpServerConfig (v0.9.3). Wires listen_backlog,
# max_*_bytes, idle_timeout_sec, and (v0.9.4) header_timeout_sec /
# body_timeout_sec on the async recv path. Slow-client mitigation
# now matches sync ServeWith.
Http1_ServeAsyncWith         = { returns = "i64" }
# Http1.ServeMtWith(port, config, handler) — multi-thread + keep-alive
# + per-conn config (v0.6.1). Production-grade entry point: combines
# ServeMt's accept fan-out with ServeWith's per-connection request
# loop + HttpServerConfig (timeouts + size limits + idle_timeout).
Http1_ServeMtWith            = { returns = "i64" }
# v0.7.0: multi-thread variants for the other 3 servers.
Http2_ServeMt                = { returns = "i64" }
Https_ServeMt                = { returns = "i64" }
Ws_ServeMt                   = { returns = "i64" }
Wss_ServeMt                  = { returns = "i64" }
Http2_ServeWith              = { returns = "i64" }
Https_ServeWith              = { returns = "i64" }
Ws_ServeWith                 = { returns = "i64" }
Wss_ServeWith                = { returns = "i64" }

# ── HttpServerConfig — per-server tunables (v0.4.3) ───────────────
HttpServerConfig_Default                = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithHeaderTimeoutSec   = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithBodyTimeoutSec     = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithIdleTimeoutSec     = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithMaxBodyBytes       = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithMaxHeaderBytes     = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithMaxUrlBytes        = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithListenBacklog      = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithTlsMinVersion      = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_WithTlsAlpn            = { returns = "AmalgameNetHttpServerConfig*" }
HttpServerConfig_HeaderTimeoutSec       = { returns = "i64" }
HttpServerConfig_BodyTimeoutSec         = { returns = "i64" }
HttpServerConfig_IdleTimeoutSec         = { returns = "i64" }
HttpServerConfig_MaxBodyBytes           = { returns = "i64" }
HttpServerConfig_MaxHeaderBytes         = { returns = "i64" }
HttpServerConfig_MaxUrlBytes            = { returns = "i64" }
HttpServerConfig_ListenBacklog          = { returns = "i64" }
HttpServerConfig_TlsMinVersion          = { returns = "i64" }
HttpServerConfig_TlsAlpn                = { returns = "code_string" }
HttpServerConfig_ApplyToFd              = { returns = "void" }
HttpServerConfig_ClearTimeoutsOnFd      = { returns = "void" }

# ── Graceful shutdown (v0.8.0) ──────────────────────────────────
# Idempotent SIGTERM/SIGINT handler + a process-wide stopping flag
# that every Serve* loop polls. Apps don't need to call these
# explicitly — Serve* installs the handlers automatically — but
# `Http1.IsStopping` + `Http1.RequestShutdown` are exposed for
# tests + custom supervisors.
Http1_InstallShutdownSignals = { returns = "void" }
Http1_IsStopping             = { returns = "code_bool" }
Http1_RequestShutdown        = { returns = "void" }

# ── H2Server — h2c listening socket (v0.2) ───────────────────────
H2Server_Listen              = { returns = "AmalgameH2Server*" }
H2Server_IsListening         = { returns = "code_bool" }
H2Server_Accept              = { returns = "AmalgameH2Conn*" }
H2Server_Close               = { returns = "void" }
# ── H2Conn — h2c server connection (v0.2) ─────────────────────────
H2Conn_NewFromFd             = { returns = "AmalgameH2Conn*" }
H2Conn_NextRequest           = { returns = "i64" }
H2Conn_Method                = { returns = "code_string" }
H2Conn_Path                  = { returns = "code_string" }
H2Conn_Authority             = { returns = "code_string" }
H2Conn_Header                = { returns = "code_string" }
H2Conn_Body                  = { returns = "code_string" }
H2Conn_BodyLen               = { returns = "i64" }
H2Conn_Respond               = { returns = "void" }
H2Conn_Close                 = { returns = "void" }
H2_Available                 = { returns = "i64" }
# ── Http2.Serve(port, handler) — high-level h2c server entry ─────
Http2_Serve                  = { returns = "i64" }

# ── HttpsServer + Https.Serve — HTTPS + ALPN h2 (v0.3) ───────────
HttpsServer_Listen           = { returns = "AmalgameHttpsServer*" }
HttpsServer_IsListening      = { returns = "code_bool" }
HttpsServer_Accept           = { returns = "AmalgameH2Conn*" }
HttpsServer_Close            = { returns = "void" }
Https_Serve                  = { returns = "i64" }

# ── WsServer / WsConn / Ws.Serve — WebSocket server (v0.4) ───────
WsServer_Listen              = { returns = "AmalgameWsServer*" }
WsServer_IsListening         = { returns = "code_bool" }
WsServer_Accept              = { returns = "AmalgameWsConn*" }
WsServer_Close               = { returns = "void" }
WsConn_ReceiveText           = { returns = "code_string" }
WsConn_SendText              = { returns = "code_bool" }
WsConn_IsClosed              = { returns = "code_bool" }
WsConn_Close                 = { returns = "void" }
Ws_Serve                     = { returns = "i64" }

# ── WssServer / Wss.Serve — wss:// (WebSocket over TLS, v0.4.1) ──
WssServer_Listen             = { returns = "AmalgameWssServer*" }
WssServer_IsListening        = { returns = "code_bool" }
WssServer_Accept             = { returns = "AmalgameWsConn*" }
WssServer_Close              = { returns = "void" }
Wss_Serve                    = { returns = "i64" }

# ─── Dependencies ────────────────────────────────────────────────
# v0.9.1: Http1.ServeAsync uses amalgame-async for fiber I/O parking
# (epoll on Linux; kqueue/IOCP backends planned). Users who only
# touch the synchronous Http1.Serve / ServeMt path still pull async
# in transitively — the static-inline bodies in Amalgame_Async.h
# don't add link-time overhead for symbols they don't reference.
[dependencies]
amalgame-async = ">=0.2.0"
